<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#05070c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- no apple-mobile-web-app-status-bar-style on purpose: with black-translucent, iOS 26+ cuts a Home Screen app one
         status bar short of the screen bottom (WebKit bug 301108), and with it or black the page still runs under the
         status bar, where iOS lays its edge blur over the header. Without it the app starts below an opaque status bar
         tinted with theme-color, which ui/theme.ts keeps on the colour of the current screen. iOS reads this only when
         the app is added to the Home Screen. -->
    <meta name="apple-mobile-web-app-title" content="Touchline" />
    <meta name="description" content="Touchline — a mobile football manager career built on real EA SPORTS FC 27 ratings and the real 2026/27 season." />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Touchline — Manager Career</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
